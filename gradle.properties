# Gradle Daemon
org.gradle.daemon=true

# 병렬 빌드 비활성 (2GB Jenkins 인스턴스 메모리 포화 방지)
org.gradle.parallel=false
org.gradle.workers.max=1

# 빌드 캐시 (변경 없는 모듈 재컴파일 방지)
org.gradle.caching=true

# JVM 메모리 (2GB Jenkins 인스턴스에서 Gradle daemon + test worker 동시 상주 대응)
org.gradle.jvmargs=-Xmx512m -XX:+HeapDumpOnOutOfMemoryError

# Configuration Cache (Gradle 8.1+ 안정화, 설정 단계 캐싱)
org.gradle.configuration-cache=true
