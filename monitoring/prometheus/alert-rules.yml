groups:
  - name: kafka-consumer-lag
    rules:
      - alert: KafkaConsumerLagWarning
        expr: sum by (kafka_consumer_group_id) (kafka_consumer_fetch_manager_records_lag) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer Lag WARNING: {{ $labels.kafka_consumer_group_id }}"
          description: "Consumer Group {{ $labels.kafka_consumer_group_id }}의 총 Lag이 {{ $value }}건입니다. 임계값: 100건"

      - alert: KafkaConsumerLagCritical
        expr: sum by (kafka_consumer_group_id) (kafka_consumer_fetch_manager_records_lag) > 1000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consumer Lag CRITICAL: {{ $labels.kafka_consumer_group_id }}"
          description: "Consumer Group {{ $labels.kafka_consumer_group_id }}의 총 Lag이 {{ $value }}건입니다. 임계값: 1000건. 즉시 확인이 필요합니다."

      - alert: KafkaConsumerNoActivity
        expr: sum by (kafka_consumer_group_id) (rate(kafka_consumer_fetch_manager_records_consumed_total[5m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consumer 비활성: {{ $labels.kafka_consumer_group_id }}"
          description: "Consumer Group {{ $labels.kafka_consumer_group_id }}가 10분간 메시지를 소비하지 않고 있습니다. Consumer 장애 여부를 확인하세요."

  - name: kafka-producer
    rules:
      - alert: KafkaProducerErrorRateHigh
        expr: >
          sum by (job) (rate(kafka_producer_record_error_total[5m]))
          / sum by (job) (rate(kafka_producer_record_send_total[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Producer 에러율 1% 초과: {{ $labels.job }}"
          description: "서비스 {{ $labels.job }}의 Kafka Producer 에러율이 {{ $value | humanizePercentage }}입니다."

      - alert: KafkaProducerErrorRateCritical
        expr: >
          sum by (job) (rate(kafka_producer_record_error_total[5m]))
          / sum by (job) (rate(kafka_producer_record_send_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Producer 에러율 5% 초과 (CRITICAL): {{ $labels.job }}"
          description: "서비스 {{ $labels.job }}의 Kafka Producer 에러율이 {{ $value | humanizePercentage }}입니다. 즉시 확인이 필요합니다."

      - alert: KafkaProducerLatencyHigh
        expr: kafka_producer_request_latency_avg > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Producer 지연 시간 500ms 초과: {{ $labels.job }}"
          description: "서비스 {{ $labels.job }}의 Kafka Producer 평균 요청 지연이 {{ $value }}ms입니다."

      - alert: KafkaProducerNoActivity
        expr: sum by (job) (rate(kafka_producer_record_send_total[5m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Producer 비활성: {{ $labels.job }}"
          description: "서비스 {{ $labels.job }}에서 15분간 Kafka 메시지 전송이 없습니다."

  - name: kafka-broker
    rules:
      - alert: KafkaBrokerDown
        expr: up{job="kafka-broker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka 브로커 다운: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }} ({{ $labels.instance }})이 1분 이상 응답하지 않습니다. 즉시 확인이 필요합니다."

      - alert: KafkaActiveControllerZero
        expr: sum(kafka_controller_kafkacontroller_activecontrollercount) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "활성 컨트롤러 없음 - Kafka 클러스터 장애"
          description: "Kafka 클러스터에 활성 컨트롤러가 없습니다. 전체 클러스터 장애 가능성이 있습니다."

      - alert: KafkaOfflinePartitions
        expr: kafka_controller_kafkacontroller_offlinepartitionscount > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "오프라인 파티션 감지: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }}에 오프라인 파티션 {{ $value }}개가 있습니다. 메시지 유실 가능성이 있습니다."

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Under-replicated 파티션 감지: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }}에 Under-replicated 파티션 {{ $value }}개가 있습니다. 데이터 안전성이 저하될 수 있습니다."

      - alert: KafkaISRShrink
        expr: rate(kafka_server_replicamanager_isrshrinkspersec_count[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ISR Shrink 감지: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }}에서 ISR Shrink가 지속적으로 발생하고 있습니다. 네트워크 또는 디스크 I/O 문제를 확인하세요."

      - alert: KafkaBrokerHighProduceLatency
        expr: kafka_network_requestmetrics_totaltimems_produce_p99 > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "브로커 Produce 지연 P99 > 1s: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }}의 Produce 요청 P99 지연이 {{ $value }}ms입니다."

      - alert: KafkaBrokerHeapUsageHigh
        expr: kafka_jvm_heap_memory_used / kafka_jvm_heap_memory_max > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "브로커 JVM Heap 사용률 90% 초과: {{ $labels.broker }}"
          description: "브로커 {{ $labels.broker }}의 JVM Heap 사용률이 {{ $value | humanizePercentage }}입니다."

  - name: kafka-dlt
    rules:
      - alert: KafkaDltMessageReceived
        expr: increase(kafka_dlt_messages_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DLT 메시지 적재 감지: {{ $labels.original_topic }}"
          description: "토픽 {{ $labels.original_topic }}에서 최근 5분간 DLT 메시지 {{ $value }}건이 적재되었습니다. 즉시 확인이 필요합니다."

      - alert: KafkaDltMessageAccumulating
        expr: increase(kafka_dlt_messages_total[1h]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DLT 메시지 누적 CRITICAL: {{ $labels.original_topic }}"
          description: "토픽 {{ $labels.original_topic }}의 DLT 메시지가 {{ $value }}건 누적되었습니다. 수동 재처리 또는 원인 분석이 필요합니다."

      - alert: KafkaDltReprocessFailureHigh
        expr: >
          sum by (original_topic) (increase(kafka_dlt_reprocess_total{outcome="failure"}[1h]))
          / sum by (original_topic) (increase(kafka_dlt_reprocess_total[1h])) > 0.5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DLT 재처리 실패율 50% 초과: {{ $labels.original_topic }}"
          description: "토픽 {{ $labels.original_topic }}의 DLT 재처리 실패율이 {{ $value | humanizePercentage }}입니다."

  - name: cache-deserialization
    rules:
      - alert: CacheDeserializationFailureSpike
        expr: increase(cache_deserialization_failure_total[5m]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "캐시 역직렬화 실패 5분간 10건 초과: {{ $labels.job }}"
          description: "service={{ $labels.job }}, cache={{ $labels.cache }}, exception={{ $labels.exception }} — 5분간 {{ $value }}건 발생. fail-safe 핸들러가 polluted entry 를 evict + cache miss 처리하지만, 형식 잔존 데이터/직렬화 정책 회귀 가능성을 점검하세요."

  - name: redis-volatility-monitoring
    rules:
      # prod self-host Redis는 #4914 결정으로 AOF 미적용 + Fargate ephemeral 운영.
      # 컨테이너 재시작 시 cache/락/Pub-Sub 휘발 → cold start 발생.
      # Prometheus는 Redis를 직접 scrape 하지 않으므로 (#4963 D4=A 결정),
      # 7개 Spring Boot 서비스(commerce/community/file/fulfillment/product/reward/user) actuator 캐시 메트릭으로 영향을 간접 추정.
      - alert: RedisCacheMissRatioSpike
        expr: |
          (
            sum by (service) (rate(cache_gets_total{result="miss"}[5m]))
            /
            (sum by (service) (rate(cache_gets_total[5m])) > 0)
          ) > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache miss 비율 80% 초과: {{ $labels.service }}"
          description: "service={{ $labels.service }} cache miss 비율이 5분간 80% 초과 ({{ $value | humanizePercentage }}). prod Redis는 #4914 결정으로 AOF 미적용 + Fargate ephemeral 이므로 컨테이너 재시작 시 cold start 발생합니다. 단일 서비스 발생 시 해당 서비스 캐시 키 패턴 회귀 가능성을 점검하세요."

      - alert: RedisAllServicesCacheMissSpike
        expr: |
          count(
            (
              sum by (service) (rate(cache_gets_total{result="miss"}[5m]))
              /
              (sum by (service) (rate(cache_gets_total[5m])) > 0)
            ) > 0.8
          ) >= 3
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "다수 서비스 동시 cache miss spike — Redis 컨테이너 재시작/장애 의심 (CRITICAL)"
          description: "현재 모니터링 대상 7개 서비스 중 {{ $value }}개에서 동시에 cache miss 비율 80% 초과 발생. prod self-host Redis 컨테이너 재시작(#4914 ephemeral) 또는 인프라 장애 가능성. 즉시 ECS Fargate Redis task 상태 + Spring Boot lettuce 재연결 로그를 확인하세요."

      - alert: RedisCacheHitRatioDropAfterRestart
        expr: |
          (
            sum by (service) (rate(cache_gets_total{result="hit"}[5m]))
            /
            (sum by (service) (rate(cache_gets_total[5m])) > 0)
          ) < 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache hit 비율 30% 미만 (cold start 의심): {{ $labels.service }}"
          description: "service={{ $labels.service }} cache hit 비율이 5분간 30% 미만 ({{ $value | humanizePercentage }}). prod Redis 컨테이너 재시작 후 cold start 회복 중이거나 키 워밍업 미흡 가능성. 회복 시간이 10분을 초과하면 캐시 사이즈/TTL 정책 점검 필요."

      - alert: RedisCacheMetricsAbsent
        expr: |
          absent(cache_gets_total) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Spring Cache Micrometer 메트릭(cache_gets_total) 부재 — 본 알람 그룹(#4963) 무력화"
          description: "10분간 cache_gets_total 메트릭이 노출되지 않습니다. RedisCacheManager 의 enableStatistics() 활성화 또는 management.metrics 노출 설정을 점검하세요. 이 상태에서는 #4963 redis-volatility-monitoring 알람 그룹이 동작하지 않습니다."
